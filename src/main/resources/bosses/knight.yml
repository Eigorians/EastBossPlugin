# 髑髏騎士 の設定
# 時間はすべて tick（1秒 = 20tick）。技の tick は「技の開始から」の経過時間（踏み込みのダッシュがある技は、振り始めから）
# 変更は /eb reload の後に召喚したボスから反映される
#
# 最期: 致命の一撃を HP 1 で耐え、全員を吹き飛ばして怨霊を放ち続ける。飛び道具は効かない。
#       怨霊をジャストガードしながら近づき、近接の一撃で倒す。
#
# ぼろぼろの赤いマントを引きずる、人の倍ほどの背の骸骨の騎士。大剣を両手で振るう。
# 身の丈を超える大剣を大きく振りかぶり、大きく踏み込んで振る。刃の判定は太く長く、走って避けるのはほぼ無理（ジャストガードで受ける）。
# 大剣の一振りはどれもジャストガードできる。ジャストガードを3回受けると体勢を崩して、大きな隙をさらす。
# 振り下ろしの後は前へ地割れが走る（横へ避ける）。離れると跳んで詰めてくる（着地点に予告の輪）。
# 技のほとんどは、斜め後ろへ下がりながら宙に浮き上がり、滑るように寄ってから、舞い降りながら打つ（降り際を見てガード）。
# 基本は溜め斬り（大剣に赤い光が満ちたら振り抜く）。連携は溜め斬りで始まり、技をランダムに 3〜4 回続けた後、疲れて隙をさらす。
# 打ち上げ（空中連撃）・溜め刺し（振り回して投げる）、離れると怨霊の弾と雷も使う。
# HP 50% で本気: 溜め斬りと薙ぎ払いが深紅の斬撃波を放ち、地割れが3本に、跳躍斬りが2連続になる。空中連撃が長く、怨霊と雷が増える。

# ===== 基本 =====
name: "<gradient:#ff4040:#7a0a14>髑髏騎士</gradient>"
model: knight
# 見た目の大きさ。モデルは元が約3ブロック（前立ての先まで）なので、1.8 で約5.4ブロック（人の3倍ほど）
model-scale: 1.8
# 殴れる当たり判定の大きさ（ハスクの倍率）。2.7 で高さ約5.3ブロック・幅約1.6ブロック
entity-scale: 2.7
max-health: 6000
# ネザライト全身・ダメージ軽減IV・耐性I を想定。6 で薙ぎ払いが約3ハート、振り下ろしが約4ハート
damage-multiplier: 6
# 旅商人からのボス戦で、参加者が1人増えるごとに増やす HP の割合（0.2 なら 1人 1倍・2人 1.2倍・3人 1.4倍）
health-per-player: 0.2
# 技と技の間の隙。この間は大剣を引きずって歩く
skill-gap-ticks: 14
# 召喚から消えるまでの時間（0 以下で無制限）。12000 = 10分
lifetime-ticks: 12000

# ===== 標的 =====
target:
  search-range: 30
  max-height: 8

# ===== ボスバー =====
bossbar:
  color: RED
  overlay: NOTCHED_10
  range: 56

# ===== 死亡 =====
death:
  animation: death
  # 両膝をつき、大剣にすがったまま目の光が消える（3.4秒）→ 灰になって崩れる
  ticks: 72

# ===== 盾 =====
# 盾で防いだダメージ（damage-multiplier を掛けた後の値）が break-damage たまると盾が壊れ、disable-ticks の間使えなくなる
# skill-multipliers: 技ごとに、防いだときにたまる量の倍率（技ID: 倍率。書いていない技は 1）
shield:
  # 大剣は重いので、ふつうのガードで受け続けると早めに壊れる
  break-damage: 80
  disable-ticks: 100
  skill-multipliers:
    # 振り下ろしは特に重い
    slam: 1.5
    slam_rage: 1.5
    # 溜め斬りも重い
    charge_slash: 1.3
    charge_slash_rage: 1.3
    combo_charge: 1.3
    combo_rage_charge: 1.3
    # 打ち上げ・溜め刺しは重い。怨霊・雷は盾で受けやすい
    launch: 1.3
    launch_rage: 1.3
    impale: 1.5
    impale_rage: 1.5
    wraith: 0.5
    wraith_rage: 0.5
    lightning: 0.5
    lightning_rage: 0.5
    # 瀕死の弾幕は普通のガードで受け続けられない（4〜5回で壊れる）
    last_stand: 1.5

# ===== 耐性 =====
immunity:
  projectile: false
  potion: true
  vertical-knockback: true

# ===== 髑髏騎士固有 =====
extra:
  # この HP の割合以下で本気になる
  rage-health-ratio: 0.5
  # 目の色（"#RRGGBB"。テクスチャの色に掛け算。#FFFFFF で元の色）と、本気の目の色
  eye-color: "#FFFFFF"
  rage-eye-color: "#FF3030"
  # 歩く速さ（ハスクは 0.23）。本気になると rage-move-speed
  move-speed: 0.27
  rage-move-speed: 0.32
  # 体勢崩し: ジャストガードをこの回数受けるとよろめく（0 で無し）。最後のジャストガードから reset-ticks たつと数え直し
  guard-break-count: 3
  guard-break-reset-ticks: 200
  guard-break-message: "<red><bold>体勢を崩した！</bold> <gray>今が殴りどき"
  # 技が終わった後に、相手の周りを回って間合いを測る割合（0〜1。回り方は skills.circle）
  circle-chance: 0.7
  # 瀕死: 致命の一撃を HP 1 で耐える（false で普通に倒れる）。技の中身は skills.last_stand
  last-stand:
    enabled: true
    title: "<gradient:#7fe8ff:#7a0a14><bold>髑髏騎士は倒れない</bold></gradient>"
    subtitle: "<gray>鐘の音で<white>ジャストガード</white>しながら近づき、<red>斬れ"
    blocked-message: "<gray>怨霊に阻まれた… <white>近づいて直接斬れ"

# ===== 技 =====
# 大剣の技（BoneStrikeSkill）の共通キー:
#   animation / range（この距離以内に標的がいるときだけ）/ hit-windows（判定の区間）/ end-ticks / damage
#   bones: [greatsword] / shape: BLADE（刃を線分で判定）/ min-blade-radius（刃の太さの最低値。1.0 で刃のまわり1ブロックまで当たる）
#   approach-speed（振る前に標的へダッシュする速さ。0 でしない）/ approach-distance / approach-max-ticks / approach-animation
#   lunge-windows（振りながら前へ踏み込む区間）/ lunge-speed / lunge-stop-distance（0 で標的を突き抜ける）
#   retreat-windows（振りかぶりながら後ろへ下がる区間）/ retreat-speed
# 髑髏騎士の追加のキー:
#   crack-tick（この tick に地割れ）/ forward（地割れの出る所。前方のブロック数）/ crack-length / crack-width
#   crack-step-ticks（1ブロック進むのにかかる tick）/ crack-damage / crack-count（本数）/ crack-spread-degrees（広がり）
#   crescent-tick（この tick に斬撃波）/ crescent-speed / crescent-range / crescent-width / crescent-damage
# 浮遊（跳躍斬り以外の技。KnightFloatSkill）: 技を始めるたびに float-chance の割合で、宙に浮いてから打つ
#   float-height まで float-rise-ticks かけて浮き上がり、最低 float-hover-ticks 宙に留まりながら標的へ寄る
#   （float-glide-speed。標的から float-distance まで。最長 float-max-ticks で打ち始める）→ 降りながら打つ。
#   技の始めから float-descend-ticks（書かなければ最初の判定の 1tick 前）で降り切る。宙から打つときのアニメは
#   air-animation（書かなければ <アニメ>_air）。浮き上がる間は float-rise-animation（書かなければ float_rise）、
#   宙を滑って寄る間は float-glide-animation（書かなければ float_glide）、寄り終えて待つ間は float-animation（書かなければ float）。
#   頭の上が狭くて浮けないときは、地上のまま打つ。連撃は連撃の方に書く（宙から打つのは1つ目だけ）
#   浮き上がる間は、標的から離れる向きを左右どちらか（開けている方）へ float-back-degrees 斜めにした方へ float-back-distance 下がる
#   ※ float-height と降りる tick は、モデルのアニメ（*_air）に合わせてある（変えるとマントの裾が地面とずれる）
# 溜め（溜め斬り）: charge-windows の間、大剣に赤い光が集まる
# 連携: steps で始め、chain-pool からランダムに足して chain-min 〜 chain-max 個。最後に finisher（演出の技）
skills:
  # ---- 薙ぎ払い: 踏み込んで、腰の高さを右から左へ。しゃがんでも当たる（後ろへ下がるか、ジャストガード）----
  slash:
    weight: 1
    # 浮遊
    float-chance: 0.8
    float-height: 3.3
    float-rise-ticks: 12
    float-hover-ticks: 8
    float-max-ticks: 44
    float-glide-speed: 0.52
    float-distance: 5.1
    float-back-distance: 4.5
    float-back-degrees: 45
    animation: slash
    # 刃が通らない足元（手より内側）にも当てる
    close-radius: 3.5
    range: 10.5
    hit-windows: ["10-21"]
    end-ticks: 30
    damage: 6
    # 振りかぶりながら下がり、振りながら大きく踏み込む
    retreat-windows: ["2-7"]
    retreat-speed: 0.22
    lunge-windows: ["9-20"]
    lunge-speed: 0.42
    lunge-stop-distance: 2.0
    bones: [greatsword]
    shape: BLADE
    min-blade-radius: 1.0
    approach-speed: 0.65
    approach-distance: 5.1
    approach-max-ticks: 16
    approach-animation: walk

  # ---- 突き: 遠くから一気に踏み込んで突く。まっすぐなので横へ避ける ----
  thrust:
    weight: 1
    # 浮遊
    float-chance: 0.8
    float-height: 3.3
    float-rise-ticks: 12
    float-hover-ticks: 8
    float-max-ticks: 44
    float-glide-speed: 0.52
    float-distance: 9.0
    float-back-distance: 4.5
    float-back-degrees: 45
    animation: thrust
    range: 15
    hit-windows: ["9-19"]
    end-ticks: 28
    damage: 7
    # 振りかぶりながら下がり、振りながら大きく踏み込む
    retreat-windows: ["2-8"]
    retreat-speed: 0.25
    lunge-windows: ["9-16"]
    lunge-speed: 0.95
    lunge-stop-distance: 2.4
    bones: [greatsword]
    shape: BLADE
    min-blade-radius: 1.0

  # ---- 振り下ろし: 頭上から叩きつけ、前へ地割れが走る。叩きつけた後は大剣が刺さったまま（殴りどき）----
  slam:
    weight: 1
    # 浮遊
    float-chance: 0.8
    float-height: 3.3
    float-rise-ticks: 12
    float-hover-ticks: 8
    float-max-ticks: 44
    float-glide-speed: 0.52
    float-distance: 4.5
    float-back-distance: 4.5
    float-back-degrees: 45
    animation: slam
    range: 9
    hit-windows: ["13-22"]
    end-ticks: 40
    damage: 8
    # 振りかぶりながら下がり、振りながら大きく踏み込む
    retreat-windows: ["2-9"]
    retreat-speed: 0.15
    lunge-windows: ["11-17"]
    lunge-speed: 0.5
    lunge-stop-distance: 2.0
    bones: [greatsword]
    shape: BLADE
    min-blade-radius: 1.0
    approach-speed: 0.52
    approach-distance: 4.5
    approach-max-ticks: 16
    approach-animation: walk
    crack-tick: 18
    forward: 3.9
    crack-length: 9
    crack-width: 2.1
    crack-step-ticks: 1
    crack-damage: 5

  # ---- 溜め斬り（基本の技）: 深く身をひねって大剣を右後ろへ引き、震えながら溜める（大剣に赤い光が集まり、目が強く灯る）
  #      → 腰の高さを大きく薙ぎ払う。溜めが長いので、光が満ちるのを見てジャストガードか、後ろへ下がる ----
  charge_slash:
    weight: 3
    # 浮遊
    float-chance: 0.8
    float-height: 3.3
    float-rise-ticks: 12
    float-hover-ticks: 8
    float-max-ticks: 44
    float-glide-speed: 0.52
    float-distance: 5.4
    float-back-distance: 4.5
    float-back-degrees: 45
    animation: charge_slash
    # 刃が通らない足元（手より内側）にも当てる
    close-radius: 3.5
    range: 10.5
    hit-windows: ["20-30"]
    end-ticks: 44
    damage: 9
    # 振りかぶりながら下がり、振りながら大きく踏み込む
    retreat-windows: ["2-12"]
    retreat-speed: 0.15
    lunge-windows: ["20-28"]
    lunge-speed: 0.95
    lunge-stop-distance: 0
    bones: [greatsword]
    shape: BLADE
    min-blade-radius: 1.0
    approach-speed: 0.65
    approach-distance: 5.4
    approach-max-ticks: 16
    approach-animation: walk
    charge-windows: ["9-22"]

  # ---- 連携: 溜め斬りで始め、chain-pool から技をランダムに足して chain-min 〜 chain-max 回続ける
  #      （chain-pool に何度も書いた技ほど出やすい。同じ技は3回続けない）。出し切ると finisher で疲れる（殴りどき）----
  combo:
    weight: 4
    # 浮遊
    float-chance: 0.8
    float-height: 3.3
    float-rise-ticks: 12
    float-hover-ticks: 8
    float-max-ticks: 44
    float-glide-speed: 0.52
    float-distance: 5.4
    float-back-distance: 4.5
    float-back-degrees: 45
    steps: [combo_charge]
    chain-pool: [combo_charge, combo_charge, combo_charge, combo_slash, combo_slash, combo_thrust, combo_slam]
    chain-min: 3
    chain-max: 4
    finisher: tired
  combo_charge:
    animation: charge_slash
    # 刃が通らない足元（手より内側）にも当てる
    close-radius: 3.5
    range: 10.5
    hit-windows: ["20-30"]
    end-ticks: 30
    damage: 9
    # 振りかぶりながら下がり、振りながら大きく踏み込む
    retreat-windows: ["2-12"]
    retreat-speed: 0.15
    lunge-windows: ["20-28"]
    lunge-speed: 0.95
    lunge-stop-distance: 0
    bones: [greatsword]
    shape: BLADE
    min-blade-radius: 1.0
    approach-speed: 0.65
    approach-distance: 5.4
    approach-max-ticks: 16
    approach-animation: walk
    charge-windows: ["9-22"]
  combo_slash:
    animation: slash
    # 刃が通らない足元（手より内側）にも当てる
    close-radius: 3.5
    range: 10.5
    hit-windows: ["10-21"]
    # 振り抜いたところで次へ
    end-ticks: 19
    damage: 6
    # 振りかぶりながら下がり、振りながら大きく踏み込む
    retreat-windows: ["2-7"]
    retreat-speed: 0.22
    lunge-windows: ["9-20"]
    lunge-speed: 0.42
    lunge-stop-distance: 2.0
    bones: [greatsword]
    shape: BLADE
    min-blade-radius: 1.0
    approach-speed: 0.65
    approach-distance: 5.1
    approach-max-ticks: 16
    approach-animation: walk
  combo_thrust:
    animation: thrust
    hit-windows: ["9-19"]
    end-ticks: 17
    damage: 6
    # 振りかぶりながら下がり、振りながら大きく踏み込む
    retreat-windows: ["2-8"]
    retreat-speed: 0.25
    lunge-windows: ["9-16"]
    lunge-speed: 0.95
    lunge-stop-distance: 2.4
    bones: [greatsword]
    shape: BLADE
    min-blade-radius: 1.0
  combo_slam:
    animation: slam
    hit-windows: ["13-22"]
    # 叩きつけて地割れを出したら、大剣を引き抜いて次へ
    end-ticks: 26
    damage: 8
    # 振りかぶりながら下がり、振りながら大きく踏み込む
    retreat-windows: ["2-9"]
    retreat-speed: 0.15
    lunge-windows: ["11-17"]
    lunge-speed: 0.5
    lunge-stop-distance: 2.0
    bones: [greatsword]
    shape: BLADE
    min-blade-radius: 1.0
    crack-tick: 18
    forward: 3.9
    crack-length: 9
    crack-width: 2.1
    crack-step-ticks: 1
    crack-damage: 5

  # ---- 跳躍斬り: 離れた相手の所へ跳んで叩きつける（min-range 以上離れているときだけ）----
  # 屈んでいる間（jump-start-ticks まで）予告の輪が標的を追い、着地の lock-ticks 前に固まる（輪が満ち始める）。輪から出れば当たらない
  leap:
    weight: 2
    animation: slam
    range: 27
    min-range: 10.5
    jump-start-ticks: 8
    land-ticks: 18
    end-ticks: 42
    jump-height: 5.85
    lock-ticks: 6
    impact-radius: 4.8
    impact-damage: 7
    knockback: 0.9

  # ===== 本気の技 =====
  # ---- 薙ぎ払い＋斬撃波: 振り抜いた瞬間に深紅の三日月が前へ飛ぶ（幅が広い。横へ大きく避けるか、ジャストガード）----
  slash_rage:
    weight: 1
    # 浮遊（本気は速く浮いて、すぐ打つ）
    float-chance: 0.9
    float-height: 3.3
    float-rise-ticks: 9
    float-hover-ticks: 5
    float-max-ticks: 36
    float-glide-speed: 0.68
    float-distance: 5.4
    float-back-distance: 4.5
    float-back-degrees: 45
    animation: slash
    # 刃が通らない足元（手より内側）にも当てる
    close-radius: 3.5
    range: 13.5
    hit-windows: ["10-21"]
    end-ticks: 30
    damage: 6
    # 振りかぶりながら下がり、振りながら大きく踏み込む
    retreat-windows: ["2-7"]
    retreat-speed: 0.25
    lunge-windows: ["9-20"]
    lunge-speed: 0.48
    lunge-stop-distance: 2.0
    bones: [greatsword]
    shape: BLADE
    min-blade-radius: 1.0
    approach-speed: 0.78
    approach-distance: 5.4
    approach-max-ticks: 14
    approach-animation: walk
    crescent-tick: 15
    crescent-speed: 0.9
    crescent-range: 14
    crescent-width: 7.0
    crescent-damage: 5

  thrust_rage:
    weight: 1
    # 浮遊（本気は速く浮いて、すぐ打つ）
    float-chance: 0.9
    float-height: 3.3
    float-rise-ticks: 9
    float-hover-ticks: 5
    float-max-ticks: 36
    float-glide-speed: 0.68
    float-distance: 9.75
    float-back-distance: 4.5
    float-back-degrees: 45
    animation: thrust
    range: 18
    hit-windows: ["9-19"]
    end-ticks: 26
    damage: 7
    # 振りかぶりながら下がり、振りながら大きく踏み込む
    retreat-windows: ["2-8"]
    retreat-speed: 0.29
    lunge-windows: ["9-16"]
    lunge-speed: 1.09
    lunge-stop-distance: 2.4
    bones: [greatsword]
    shape: BLADE
    min-blade-radius: 1.0

  # ---- 振り下ろし: 地割れが扇に3本 ----
  slam_rage:
    weight: 1
    # 浮遊（本気は速く浮いて、すぐ打つ）
    float-chance: 0.9
    float-height: 3.3
    float-rise-ticks: 9
    float-hover-ticks: 5
    float-max-ticks: 36
    float-glide-speed: 0.68
    float-distance: 4.5
    float-back-distance: 4.5
    float-back-degrees: 45
    animation: slam
    range: 9
    hit-windows: ["13-22"]
    end-ticks: 38
    damage: 8
    # 振りかぶりながら下がり、振りながら大きく踏み込む
    retreat-windows: ["2-9"]
    retreat-speed: 0.17
    lunge-windows: ["11-17"]
    lunge-speed: 0.57
    lunge-stop-distance: 2.0
    bones: [greatsword]
    shape: BLADE
    min-blade-radius: 1.0
    approach-speed: 0.65
    approach-distance: 4.5
    approach-max-ticks: 14
    approach-animation: walk
    crack-tick: 18
    forward: 3.9
    crack-length: 11
    crack-width: 2.1
    crack-step-ticks: 1
    crack-damage: 5
    crack-count: 3
    crack-spread-degrees: 50

  # ---- 溜め斬り: 振り抜くと深紅の斬撃波が飛ぶ ----
  charge_slash_rage:
    weight: 3
    # 浮遊（本気は速く浮いて、すぐ打つ）
    float-chance: 0.9
    float-height: 3.3
    float-rise-ticks: 9
    float-hover-ticks: 5
    float-max-ticks: 36
    float-glide-speed: 0.68
    float-distance: 5.4
