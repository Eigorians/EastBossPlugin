    # 振りかぶりながら下がり、振りながら大きく踏み込む
    retreat-windows: ["2-7"]
    retreat-speed: 0.25
    lunge-windows: ["9-20"]
    lunge-speed: 0.48
    lunge-stop-distance: 2.0
    bones: [greatsword]
    shape: BLADE
    min-blade-radius: 1.0
    approach-speed: 0.78
    approach-distance: 5.4
    approach-max-ticks: 14
    approach-animation: walk
    crescent-tick: 15
    crescent-speed: 0.9
    crescent-range: 12
    crescent-width: 6.3
    crescent-damage: 5
  combo_rage_thrust:
    animation: thrust
    hit-windows: ["9-19"]
    end-ticks: 17
    damage: 6
    # 振りかぶりながら下がり、振りながら大きく踏み込む
    retreat-windows: ["2-8"]
    retreat-speed: 0.29
    lunge-windows: ["9-16"]
    lunge-speed: 1.09
    lunge-stop-distance: 2.4
    bones: [greatsword]
    shape: BLADE
    min-blade-radius: 1.0
  combo_rage_slam:
    animation: slam
    hit-windows: ["13-22"]
    end-ticks: 26
    damage: 8
    # 振りかぶりながら下がり、振りながら大きく踏み込む
    retreat-windows: ["2-9"]
    retreat-speed: 0.17
    lunge-windows: ["11-17"]
    lunge-speed: 0.57
    lunge-stop-distance: 2.0
    bones: [greatsword]
    shape: BLADE
    min-blade-radius: 1.0
    crack-tick: 18
    forward: 3.9
    crack-length: 11
    crack-width: 2.1
    crack-step-ticks: 1
    crack-damage: 5
    crack-count: 3
    crack-spread-degrees: 50

  # ---- 跳躍斬り: 2回続けて跳ぶ（2回目は近くても跳ぶ）。着地点から斜め四方へ地割れ ----
  leap_rage:
    weight: 2
    animation: slam
    range: 30
    min-range: 9
    jump-start-ticks: 7
    land-ticks: 17
    end-ticks: 34
    jump-height: 6.5
    lock-ticks: 6
    impact-radius: 5.1
    impact-damage: 7
    knockback: 1.0
    crack-length: 6
    crack-width: 1.95
    crack-step-ticks: 1
    crack-damage: 5
    crack-count: 4
    crack-spread-degrees: 270

  # ===== 打ち上げ → 空中連撃（KnightLaunchSkill）=====
  # 下から斬り上げ、当たった相手を空高く打ち上げる（ガード・ジャストガードしても飛ぶ。ダメージはガードで防げる）。
  # 騎士も跳んで追いつき、宙に留めた相手を素早い連撃で斬り続け、最後に真下へ叩き落とす。打ち上げた相手は落下ダメージを受けない
  launch:
    weight: 2
    animation: launch
    range: 8
    # 斬り上げ（前方の扇）。当たった相手は、ガードしていても launch-tick 後に真上へ飛ぶ（2.05 でおよそ 20 ブロック）
    hit-windows: ["10-13"]
    hit-radius: 6
    hit-degrees: 150
    damage: 5
    launch-tick: 2
    launch-velocity: 2.05
    # 空振りのとき技を終える tick
    end-ticks: 30
    # 追って跳ぶ tick・追いつくまで・相手を留める騎士の前の距離
    jump-tick: 20
    rise-ticks: 10
    hold-distance: 3.2
    # 空中連撃（combo-interval-ticks ごとに1太刀）
    combo-animation: air_combo
    combo-hits: 6
    combo-interval-ticks: 3
    combo-damage: 2
    # とどめ: 振りかぶって finish-tick に叩き落とす → land-tick に着地 → recover-ticks の隙
    finish-animation: air_finish
    finish-tick: 7
    finish-damage: 5
    smash-velocity: 1.4
    land-tick: 18
    recover-ticks: 18
    # 打ち上げた相手を落下ダメージから守る長さ（着地したら終わる）
    fall-protect-ticks: 240
  launch_rage:
    weight: 2
    animation: launch
    range: 8
    # 斬り上げ（前方の扇）。当たった相手は、ガードしていても launch-tick 後に真上へ飛ぶ（2.05 でおよそ 20 ブロック）
    hit-windows: ["10-13"]
    hit-radius: 6
    hit-degrees: 150
    damage: 5
    launch-tick: 2
    launch-velocity: 2.05
    # 空振りのとき技を終える tick
    end-ticks: 30
    # 追って跳ぶ tick・追いつくまで・相手を留める騎士の前の距離
    jump-tick: 20
    rise-ticks: 10
    hold-distance: 3.2
    # 空中連撃（combo-interval-ticks ごとに1太刀）
    combo-animation: air_combo
    combo-hits: 9
    combo-interval-ticks: 2
    combo-damage: 2
    # とどめ: 振りかぶって finish-tick に叩き落とす → land-tick に着地 → recover-ticks の隙
    finish-animation: air_finish
    finish-tick: 7
    finish-damage: 5
    smash-velocity: 1.4
    land-tick: 18
    recover-ticks: 18
    # 打ち上げた相手を落下ダメージから守る長さ（着地したら終わる）
    fall-protect-ticks: 240

  # ===== 溜め刺し → 振り回して投げる（KnightImpaleSkill）=====
  # 大剣を肩の高さで引き絞って長く溜め、長く踏み込んで突く。刺さった相手は刃に刺さったまま、掲げて振り回され、前へ投げ飛ばされる
  # （投げられた相手は落下ダメージを受けない）。溜めをよく見て、突きをジャストガードすれば刺さらない
  impale:
    weight: 2
    animation: impale
    range: 16
    # 長い溜め（charge-windows の間、刃に赤い光が集まり、目が強く灯る）→ thrust-tick に突く
    thrust-tick: 30
    charge-windows: ["8-28"]
    lunge-windows: ["29-35"]
    lunge-speed: 1.2
    lunge-stop-distance: 3.0
    # 刃（柄〜切っ先）の線から hit-radius 以内に当たる。最初の1人が刺さる（ジャストガードされたら刺さらない）
    hit-windows: ["29-36"]
    hit-radius: 1.3
    damage: 8
    # 刺さらなかったときは、突いたままの隙（殴りどき）で終わる
    end-ticks: 56
    taken-damage-multiplier: 1.0
    # 刺さったら swing-start-tick に、相手ごと掲げて振り回し、swing の throw-tick に前へ投げる
    swing-animation: impale_swing
    swing-start-tick: 36
    swing-ticks: 40
    throw-tick: 29
    throw-speed: 2.4
    throw-up: 0.9
    throw-damage: 6
    # 刺している間のダメージ（hold-damage-interval ごと）と、相手を留める刃の位置（柄 0 〜 切っ先 1）
    hold-damage: 1
    hold-damage-interval: 8
    blade-point: 0.72
    fall-protect-ticks: 240
  impale_rage:
    weight: 2
    animation: impale
    range: 16
    # 長い溜め（charge-windows の間、刃に赤い光が集まり、目が強く灯る）→ thrust-tick に突く
    thrust-tick: 30
    charge-windows: ["8-28"]
    lunge-windows: ["29-35"]
    lunge-speed: 1.2
    lunge-stop-distance: 3.0
    # 刃（柄〜切っ先）の線から hit-radius 以内に当たる。最初の1人が刺さる（ジャストガードされたら刺さらない）
    hit-windows: ["29-36"]
    hit-radius: 1.3
    damage: 8
    # 刺さらなかったときは、突いたままの隙（殴りどき）で終わる
    end-ticks: 56
    taken-damage-multiplier: 1.0
    # 刺さったら swing-start-tick に、相手ごと掲げて振り回し、swing の throw-tick に前へ投げる
    swing-animation: impale_swing
    swing-start-tick: 36
    swing-ticks: 40
    throw-tick: 29
    throw-speed: 2.4
    throw-up: 0.9
    throw-damage: 6
    # 刺している間のダメージ（hold-damage-interval ごと）と、相手を留める刃の位置（柄 0 〜 切っ先 1）
    hold-damage: 1
    hold-damage-interval: 8
    blade-point: 0.72
    fall-protect-ticks: 240

  # ===== 怨霊（KnightWraithSkill）=====
  # 離れているとき、左手を突き出して体から怨霊（魂の弾）を次々に放つ。怨霊は左右へ弧を描いて飛び出し、ゆっくり相手を追う。
  # ブロックに当たると消える（物陰に隠れる・引きつけて横へかわす・ジャストガード）
  wraith:
    weight: 2
    animation: cast
    range: 30
    # 相手がこれより離れているときだけ使う
    min-range: 9
    # 体から放つ tick と、1回に放つ数（左右交互に、横へ 40〜40+spread-degrees 度ひらいて少し上へ飛び出す）
    release-ticks: [10, 16, 22, 28, 34]
    count: 1
    spread-degrees: 70
    # 飛び出す速さ → だんだん speed へ落ち着く。1tick に turn-degrees ずつ相手の方へ向きを変える（小さいほどゆるい弧）
    launch-speed: 0.8
    speed: 0.32
    turn-degrees: 4
    max-life-ticks: 170
    damage: 5
    hit-radius: 0.8
    end-ticks: 44
  wraith_rage:
    weight: 2
    animation: cast
    range: 30
    # 相手がこれより離れているときだけ使う
    min-range: 9
    # 体から放つ tick と、1回に放つ数（左右交互に、横へ 40〜40+spread-degrees 度ひらいて少し上へ飛び出す）
    release-ticks: [8, 12, 16, 20, 24, 28, 32, 36]
    count: 1
    spread-degrees: 70
    # 飛び出す速さ → だんだん speed へ落ち着く。1tick に turn-degrees ずつ相手の方へ向きを変える（小さいほどゆるい弧）
    launch-speed: 0.8
    speed: 0.32
    turn-degrees: 4
    max-life-ticks: 170
    damage: 5
    hit-radius: 0.8
    end-ticks: 44

  # ===== 雷（KnightLightningSkill）=====
  # 離れているとき、大剣を天へ掲げて雷を呼ぶ。しばらくの間、相手のまわりへ雷が降り続ける（予告の輪が満ちると落ちる。輪から出る）
  lightning:
    weight: 2
    animation: cast_sky
    channel-animation: channel
    range: 32
    min-range: 9
    # 掲げてから channel-start-tick に呼び始め、channel-ticks の間 interval-ticks ごとに count 本ずつ雷を予約する
    channel-start-tick: 16
    channel-ticks: 100
    interval-ticks: 6
    count: 1
    # 予告の輪が満ちるまで（避ける猶予）・相手のまわりの範囲・相手の足元ちょうどを狙う割合
    warning-ticks: 18
    area-radius: 9
    aim-ratio: 0.35
    impact-radius: 2.0
    impact-damage: 6
    # 呼んでいる間は動かない（殴りどき）
    taken-damage-multiplier: 1.0
  lightning_rage:
    weight: 2
    animation: cast_sky
    channel-animation: channel
    range: 32
    min-range: 9
    # 掲げてから channel-start-tick に呼び始め、channel-ticks の間 interval-ticks ごとに count 本ずつ雷を予約する
    channel-start-tick: 16
    channel-ticks: 120
    interval-ticks: 4
    count: 2
    # 予告の輪が満ちるまで（避ける猶予）・相手のまわりの範囲・相手の足元ちょうどを狙う割合
    warning-ticks: 18
    area-radius: 9
    aim-ratio: 0.35
    impact-radius: 2.0
    impact-damage: 6
    # 呼んでいる間は動かない（殴りどき）
    taken-damage-multiplier: 1.0

  # ===== 間合いを測る（技の合間。抽選では選ばれず、技が終わった後に extra.circle-chance の割合で出る）=====
  # 大剣を構えたまま相手を見据え、横へ回る（すり足）。ときどき素早く横へステップする（stepReverseChance の割合で逆へ）
  # 相手との距離が min-range〜max-range のときだけ回る。回りながら preferred-distance へ少しずつ寄せる
  circle:
    min-range: 4
    max-range: 14
    preferred-distance: 7.5
    # 回る速さ（1tick に進むブロック）
    speed: 0.17
    # 回り続ける時間（この間でランダム）
    min-ticks: 30
    max-ticks: 70
    # 横ステップ: 間隔（この間でランダム）・かける時間・跳ぶ距離・逆へ跳ぶ割合
    step-interval-min: 16
    step-interval-max: 32
    step-ticks: 7
    step-distance: 3.5
    step-reverse-chance: 0.4
    left-animation: strafe_left
    right-animation: strafe_right
    step-left-animation: step_left
    step-right-animation: step_right

  # ===== 瀕死（KnightLastStandSkill。HP 1 で耐えたときに始まり、倒されるまで終わらない）=====
  # 片膝をついて怨霊を吸い込む → blast-tick に絶叫して range 以内の全員をノーダメージで吹き飛ばす
  # → barrage-start-tick から、全員それぞれに怨霊の束を放ち続ける（ここから近接の一撃で倒せる。それ以外は効かない）
  last_stand:
    animation: last_stand
    loop-animation: last_stand_loop
    range: 64
    blast-tick: 30
    # 吹き飛ばされて着く、騎士からのおよその距離
    push-distance: 28
    fall-protect-ticks: 240
    barrage-start-tick: 52
    # 1人につき interval-ticks ごとに count 体の束。束は必ず追いつき、同時に届く（当たりは1回）
    interval-ticks: 20
    count: 7
    # 届くまでの tick = 距離 / speed（最短 min-flight-ticks）
    speed: 0.9
    min-flight-ticks: 12
    # 届くこの tick 前に、狙われた本人へ鐘の音（構える合図。ジャストガードの受付は 6tick）
    cue-lead-ticks: 7
    damage: 2
    # ジャストガードしなかったとき押し戻す速さ（普通に防いでも押される。1.15 でおよそ 5 ブロック）
    knockback: 1.15

  # ===== 演出 =====
  # 登場: 大剣を突き立てて片膝をついている → 目が灯り、立ち上がって大剣を引き抜く
  spawn_intro:
    animation: spawn
    end-ticks: 64
    taken-damage-multiplier: 0.3
  # 本気: 震えながら力を溜め、change-tick で天を仰いで吠える（impact-radius 以内を knockback で吹き飛ばす）
  rage_shift:
    animation: rage_shift
    end-ticks: 60
    change-tick: 24
    impact-radius: 9.0
    knockback: 1.2
    taken-damage-multiplier: 0.3
  # プレイヤーを倒したとき: 首をかしげて剣先を向ける
  taunt:
    animation: taunt
    end-ticks: 40
  # 疲れ（連携の最後）: 大剣を突き立ててもたれかかり、肩で息をする（殴りどき。受けるダメージが増える）
  tired:
    animation: tired
    end-ticks: 64
    taken-damage-multiplier: 1.4
  # 体勢崩し: のけぞってふらつく（殴りどき。受けるダメージが増える）
  stagger:
    animation: stagger
    end-ticks: 48
    taken-damage-multiplier: 1.5
