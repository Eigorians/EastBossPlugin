    crescent-range: 14
    crescent-width: 7.7
    crescent-damage: 6

  # ---- 連携: 溜め斬り（斬撃波）で始め、本気の技をランダムに 3〜4 回続けて、疲れる ----
  combo_rage:
    weight: 5
    # 浮遊（本気は速く浮いて、すぐ打つ）
    float-chance: 0.9
    float-height: 3.3
    float-rise-ticks: 9
    float-hover-ticks: 5
    float-max-ticks: 36
    float-glide-speed: 0.68
    float-distance: 5.4
    float-back-distance: 4.5
    float-back-degrees: 45
    steps: [combo_rage_charge]
    chain-pool: [combo_rage_charge, combo_rage_charge, combo_rage_charge, combo_rage_slash, combo_rage_slash, combo_rage_thrust, combo_rage_slam]
    chain-min: 3
    chain-max: 4
    finisher: tired
  combo_rage_charge:
    animation: charge_slash
    # 刃が通らない足元（手より内側）にも当てる
    close-radius: 3.5
    range: 12
    hit-windows: ["20-30"]
    end-ticks: 30
    damage: 9
    # 振りかぶりながら下がり、振りながら大きく踏み込む
    retreat-windows: ["2-12"]
    retreat-speed: 0.17
    lunge-windows: ["20-28"]
    lunge-speed: 1.09
    lunge-stop-distance: 0
    bones: [greatsword]
    shape: BLADE
    min-blade-radius: 1.0
    approach-speed: 0.78
    approach-distance: 5.4
    approach-max-ticks: 14
    approach-animation: walk
    charge-windows: ["9-22"]
    crescent-tick: 25
    crescent-speed: 0.9
    crescent-range: 14
    crescent-width: 7.7
    crescent-damage: 6
  combo_rage_slash:
    animation: slash
    # 刃が通らない足元（手より内側）にも当てる
    close-radius: 3.5
