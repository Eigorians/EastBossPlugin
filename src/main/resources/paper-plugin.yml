name: EastBossPlugin
version: '${version}'

main: com.eastcompany.eastsub.eastBossPlugin.EastBossPlugin
api-version: '26.3'
load: POSTWORLD

dependencies:
  server:
    # BetterModel が無い場合、Paper はこのプラグインを読み込まない
    BetterModel:
      load: BEFORE
      required: true
      # BetterModel のクラスを参照するために必要
      join-classpath: true

permissions:
  eastboss.admin:
    description: /eastboss コマンドをすべて使える
    default: op
  eastboss.progress.bypass:
    description: ボスの解放の順番に関係なく、どのボスの戦いでも始められる
    default: op
